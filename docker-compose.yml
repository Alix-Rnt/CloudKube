version: '3.8'

services:

  history-service:
    build: ./history-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
    volumes:
      - history-data:/app/data

  conversion-service:
    build: ./conversion-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - HISTORY_SERVICE_URL=http://history-service:8081
    depends_on:
      - history-service

  frontend-service:
    build: ./frontend-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - CONVERSION_SERVICE_URL=http://conversion-service:8080
      - HISTORY_SERVICE_URL=http://history-service:8081
    depends_on:
      - conversion-service
      - history-service

volumes:
  history-data: